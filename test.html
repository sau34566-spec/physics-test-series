 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --bg-dark: #0f172a;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .test-container {
            background: var(--bg-card);
            width: 100%;
            max-width: 650px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        p {
            color: #64748b;
            font-size: 1rem;
        }

        /* Custom Warning Box (Alert ka replacement) */
        #warning-banner {
            display: none;
            background-color: #fee2e2;
            border: 1px solid var(--danger);
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="test-container">
        <div id="warning-banner"><i class="fa-solid fa-triangle-exclamation"></i> <span id="warning-msg"></span></div>
        
        <h1><i class="fa-solid fa-flask-vial"></i> Physics Test Started!</h1>
        <p>Your environment is securely locked. Do not attempt to switch tabs or copy content.</p>
    </div>

    <script>
        let warningCount = 0;
        const maxWarnings = 3;

        function showWarning(message) {
            const banner = document.getElementById('warning-banner');
            const msgSpan = document.getElementById('warning-msg');
            msgSpan.innerText = message;
            banner.style.display = 'block';

            setTimeout(() => {
                banner.style.display = 'none';
            }, 4000);
        }

        // 1. Context Menu Disable
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Copy/Paste Disable
        document.addEventListener('copy', (e) => {
            e.preventDefault();
            showWarning("Copying text is prohibited!");
        });
        document.addEventListener('paste', (e) => {
            e.preventDefault();
            showWarning("Pasting functions are locked!");
        });

        // 3. Tab Switching Detection (Safe Way)
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                warningCount++;
                if (warningCount >= maxWarnings) {
                    alert("Test Auto-Submitted due to multiple tab switching violations!");
                    // Yahan test submit karne ka function call karein
                } else {
                    showWarning(`Tab switch detected! Warning ${warningCount}/${maxWarnings}`);
                }
            }
        });

        // 4. Keyboard Shortcuts Disable
        document.addEventListener("keydown", function(e) {
            // Ctrl+P / Ctrl+S / Ctrl+U / F12 / Ctrl+Shift+I
            if (
                (e.ctrlKey && ['p', 's', 'u'].includes(e.key.toLowerCase())) ||
                e.key === "F12" ||
                (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase()))
            ) {
                e.preventDefault();
                showWarning("Developer Tools and Shortcuts are disabled!");
            }

            // PrintScreen Clear
            if (e.key === "PrintScreen") {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText("");
                }
                showWarning("Screenshots are restricted on this exam page!");
            }
        });
    </script>
</body>
</html>
