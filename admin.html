<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Elite | Professional Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --accent: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.75rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-sub);
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .status-alert {
            display: none;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 500;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="header">
            <h1><i class="fa-solid fa-user-shield" style="color: var(--primary);"></i> Admin Control Portal</h1>
            <p>Configure and publish test content directly to students</p>
        </div>

        <form id="admin-form">
            <div class="form-group">
                <label for="json-url"><i class="fa-solid fa-link"></i> External JSON Data / Question File Link</label>
                <input type="text" id="json-url" placeholder="https://raw.githubusercontent.com/.../chapter1.json" required>
            </div>

            <div class="form-group">
                <label for="exam-title"><i class="fa-solid fa-file-signature"></i> Exam Title / Subject</label>
                <input type="text" id="exam-title" value="Physics Test Series" placeholder="Enter exam title">
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-lock"></i> Save & Publish Exam Config
            </button>
        </form>

        <div id="status-box" class="status-alert status-success">
            <i class="fa-solid fa-circle-check"></i> Configuration saved! Test is now live without time restrictions.
        </div>
    </div>

    <script>
        // Load existing saved URL if available
        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('examJsonUrl');
            const savedTitle = localStorage.getItem('examTitle');
            if (savedUrl) document.getElementById('json-url').value = savedUrl;
            if (savedTitle) document.getElementById('exam-title').value = savedTitle;
        });

        document.getElementById('admin-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const jsonUrl = document.getElementById('json-url').value.trim();
            const examTitle = document.getElementById('exam-title').value.trim();

            if (!jsonUrl) {
                alert("Please enter a valid JSON Data Link!");
                return;
            }

            // Permanent Active Configuration Object (No Timing Restrictions)
            const configData = {
                jsonUrl: jsonUrl,
                title: examTitle || "Physics Test Series",
                // Setting permanent open window (Jan 2020 to Dec 2099) so student portal never blocks
                windowStart: new Date("2020-01-01").getTime(),
                windowEnd: new Date("2099-12-31").getTime(),
                isExamActive: true,
                updatedAt: new Date().toISOString()
            };

            // Save to LocalStorage (or integrate Firebase updateDoc here if needed)
            localStorage.setItem('examJsonUrl', jsonUrl);
            localStorage.setItem('examTitle', examTitle);
            localStorage.setItem('examSchedule', JSON.stringify(configData));

            // Show Success Banner
            const statusBox = document.getElementById('status-box');
            statusBox.style.display = 'block';

            setTimeout(() => {
                statusBox.style.display = 'none';
            }, 4000);
        });
    </script>
</body>
</html>
