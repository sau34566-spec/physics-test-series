 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Physics Online Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-accent: #2563eb;
            --bg-dark: #0f172a;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem; }

        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .header h2 { color: var(--primary); font-weight: 800; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.4rem; color: #334155; }
        .form-control { width: 100%; padding: 0.75rem 1rem; border: 2px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; outline: none; }

        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 0.8rem 1rem;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            margin-bottom: 1rem;
            cursor: pointer;
            font-weight: 700;
            color: var(--primary);
        }

        #json-box-wrapper { display: none; margin-bottom: 1.5rem; }
        textarea.code-box { font-family: monospace; background: #1e293b; color: #38bdf8; min-height: 150px; }

        .btn { padding: 0.75rem 1.4rem; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-primary { background: var(--primary-accent); color: white; }
        .btn-danger { background: #dc2626; color: white; }

        .q-card, .res-card { background: #f8fafc; border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid var(--border-color); padding: 0.75rem; text-align: left; font-size: 0.88rem; }
        th { background: #f1f5f9; color: var(--primary); }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header">
            <h2><i class="fa-solid fa-user-gear"></i> Admin Test Portal</h2>
            <button class="btn btn-danger" onclick="resetAttempts()"><i class="fa-solid fa-rotate-left"></i> Reset Student Attempts</button>
        </div>

        <!-- TEST CONFIGURATION -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 1rem;">
            <div class="form-group"><label>Time Duration (Mins)</label><input type="number" id="cfg-time" class="form-control" value="15"></div>
            <div class="form-group"><label>Positive Mark</label><input type="number" id="cfg-pos" class="form-control" value="1" step="0.25"></div>
            <div class="form-group"><label>Negative Mark</label><input type="number" id="cfg-neg" class="form-control" value="0.25" step="0.25"></div>
        </div>
        <button class="btn btn-primary" onclick="saveSettings()" style="margin-bottom: 1.5rem;"><i class="fa-solid fa-floppy-disk"></i> Save Settings</button>

        <hr style="margin-bottom: 1.5rem; border: none; border-top: 2px solid #f1f5f9;">

        <!-- QUESTION UPLOAD & JSON CODE OPTION -->
        <h3 style="margin-bottom: 1rem; color: var(--primary);"><i class="fa-solid fa-file-circle-plus"></i> Upload Questions</h3>

        <label class="checkbox-option">
            <input type="checkbox" id="json-toggle-checkbox" onchange="toggleJsonMode()">
            <span><i class="fa-solid fa-code"></i> Upload via JSON / Code Mode</span>
        </label>

        <div id="json-box-wrapper">
            <div class="form-group">
                <label>Paste JSON Code Here</label>
                <textarea id="json-code" class="form-control code-box" placeholder='[{"question": "SI Unit of Force?", "options": ["N", "J", "W", "Pa"], "answer": 0}]'></textarea>
            </div>
            <button class="btn btn-primary" onclick="loadFromJSONCode()"><i class="fa-solid fa-upload"></i> Load Code Questions</button>
        </div>

        <div id="manual-form-wrapper">
            <div class="form-group"><label>Question Statement</label><input type="text" id="q-text" class="form-control"></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group"><label>Option A</label><input type="text" id="opt-0" class="form-control"></div>
                <div class="form-group"><label>Option B</label><input type="text" id="opt-1" class="form-control"></div>
                <div class="form-group"><label>Option C</label><input type="text" id="opt-2" class="form-control"></div>
                <div class="form-group"><label>Option D</label><input type="text" id="opt-3" class="form-control"></div>
            </div>
            <div class="form-group">
                <label>Correct Answer Index (0 = A, 1 = B, 2 = C, 3 = D)</label>
                <select id="correct-opt" class="form-control">
                    <option value="0">Option A</option>
                    <option value="1">Option B</option>
                    <option value="2">Option C</option>
                    <option value="3">Option D</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="addSingleQuestion()"><i class="fa-solid fa-plus"></i> Add Question</button>
        </div>

        <h3 style="margin-top: 2rem; margin-bottom: 1rem; color: var(--primary);">Question Bank (<span id="q-count">0</span>)</h3>
        <div id="questions-list"></div>

        <hr style="margin: 2rem 0; border: none; border-top: 2px solid #f1f5f9;">

        <!-- STUDENT TEST RESULTS REPORTS -->
        <h3 style="margin-bottom: 1rem; color: var(--primary);"><i class="fa-solid fa-square-poll-vertical"></i> Submitted Student Results</h3>
        <table>
            <thead>
                <tr>
                    <th>Candidate</th>
                    <th>Email</th>
                    <th>Batch</th>
                    <th>Score</th>
                    <th>Correct/Wrong</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="results-table-body"></tbody>
        </table>
    </div>

    <script>
        let questionBank = JSON.parse(localStorage.getItem('adminQuestionBank') || '[]');

        window.onload = function() {
            renderQuestions();
            renderResults();
            
            const savedSettings = JSON.parse(localStorage.getItem('adminExamSettings') || '{}');
            if (savedSettings.duration) document.getElementById('cfg-time').value = savedSettings.duration;
            if (savedSettings.pos) document.getElementById('cfg-pos').value = savedSettings.pos;
            if (savedSettings.neg) document.getElementById('cfg-neg').value = savedSettings.neg;
        };

        function saveSettings() {
            const settings = {
                duration: document.getElementById('cfg-time').value,
                pos: document.getElementById('cfg-pos').value,
                neg: document.getElementById('cfg-neg').value
            };
            localStorage.setItem('adminExamSettings', JSON.stringify(settings));
            alert("Test settings saved!");
        }

        function toggleJsonMode() {
            const isChecked = document.getElementById('json-toggle-checkbox').checked;
            document.getElementById('json-box-wrapper').style.display = isChecked ? 'block' : 'none';
        }

        function loadFromJSONCode() {
            const code = document.getElementById('json-code').value.trim();
            if (!code) return alert("Please paste valid JSON code!");
            try {
                const parsed = JSON.parse(code);
                if (Array.isArray(parsed)) {
                    questionBank = parsed;
                    saveAndRender();
                    alert("Questions loaded successfully!");
                }
            } catch(e) { alert("Invalid JSON format!"); }
        }

        function addSingleQuestion() {
            const text = document.getElementById('q-text').value.trim();
            const o0 = document.getElementById('opt-0').value.trim();
            const o1 = document.getElementById('opt-1').value.trim();
            const o2 = document.getElementById('opt-2').value.trim();
            const o3 = document.getElementById('opt-3').value.trim();
            const ans = parseInt(document.getElementById('correct-opt').value);

            if (!text || !o0 || !o1 || !o2 || !o3) return alert("Fill all fields!");

            questionBank.push({ question: text, options: [o0, o1, o2, o3], answer: ans });
            saveAndRender();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-list');
            document.getElementById('q-count').innerText = questionBank.length;
            container.innerHTML = '';
            questionBank.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'q-card';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>Q${idx + 1}: ${q.question}</strong>
                            <div style="font-size:0.85rem; color:#64748b;">Ans: ${q.options[q.answer]}</div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteQuestion(${idx})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderResults() {
            const tbody = document.getElementById('results-table-body');
            const studentResults = JSON.parse(localStorage.getItem('studentResults') || '[]');
            tbody.innerHTML = '';
            studentResults.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.name}</td>
                    <td>${r.email}</td>
                    <td>${r.batch}</td>
                    <td><strong>${r.score}</strong></td>
                    <td>${r.correct} / ${r.wrong}</td>
                    <td>${r.date}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteQuestion(index) {
            questionBank.splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('adminQuestionBank', JSON.stringify(questionBank));
            renderQuestions();
        }

        function resetAttempts() {
            if (confirm("Reset all student email attempts?")) {
                localStorage.removeItem('attemptedEmails');
                alert("Attempts reset!");
            }
        }
    </script>
</body>
</html>
