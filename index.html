 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Online Test | NTA Style</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-accent: #2563eb;
            --bg-dark: #0f172a;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;

            /* NTA Palette Colors */
            --nta-answered: #16a34a;       /* Green */
            --nta-not-answered: #dc2626;   /* Red */
            --nta-review: #9333ea;         /* Purple */
            --nta-not-visited: #94a3b8;    /* Gray */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem;
            overflow-x: hidden;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* LOGIN MODAL STYLES */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        .login-box p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus {
            border-color: var(--primary-accent);
        }

        /* MAIN EXAM CONTAINER LAYOUT */
        .test-wrapper {
            display: none; /* Hidden until login */
            grid-template-columns: 1fr 340px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 992px) {
            .test-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .question-card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .q-title {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 800;
        }

        .timer-display {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .q-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1rem 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .option-item:hover {
            border-color: var(--primary-accent);
            background: #eff6ff;
        }

        .option-item.selected {
            border-color: var(--primary-accent);
            background: #dbeafe;
            color: #1e40af;
        }

        .option-item input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
            border-top: 2px solid #f1f5f9;
            padding-top: 1.5rem;
        }

        .btn {
            padding: 0.8rem 1.4rem;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary { background: var(--primary-accent); color: white; width: 100%; justify-content: center; }
        .btn-save { background: var(--nta-answered); color: white; }
        .btn-save:hover { background: #15803d; }

        .btn-review { background: var(--nta-review); color: white; }
        .btn-review:hover { background: #7e22ce; }

        .btn-clear { background: #e2e8f0; color: #334155; }
        .btn-clear:hover { background: #cbd5e1; }

        .btn-submit { background: var(--primary); color: white; }
        .btn-submit:hover { background: #1e40af; }

        .palette-sidebar {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            height: fit-content;
        }

        .palette-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .legend-item { display: flex; align-items: center; gap: 8px; }

        .badge-icon {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .badge-answered { background: var(--nta-answered); }
        .badge-not-answered { background: var(--nta-not-answered); }
        .badge-review { background: var(--nta-review); }
        .badge-not-visited { background: var(--nta-not-visited); }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .q-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            color: white;
            background: var(--nta-not-visited);
            transition: transform 0.15s ease;
            position: relative;
            font-family: 'Inter', sans-serif;
        }

        .q-btn:hover { transform: scale(1.08); }
        .q-btn.active-current { outline: 3px solid var(--primary); outline-offset: 2px; }

        .q-btn.status-answered { background: var(--nta-answered); }
        .q-btn.status-not-answered { background: var(--nta-not-answered); }
        .q-btn.status-review { background: var(--nta-review); }
        .q-btn.status-review-answered { background: var(--nta-review); }
        .q-btn.status-review-answered::after {
            content: '★';
            position: absolute;
            top: 1px;
            right: 3px;
            font-size: 0.65rem;
            color: #fde047;
        }
    </style>
</head>
<body>

    <!-- STUDENT LOGIN MODAL -->
    <div class="login-overlay" id="login-modal">
        <div class="login-box">
            <h2>Candidate Login</h2>
            <p>Please enter your details to start test</p>
            <form id="student-login-form" onsubmit="startExamPortal(event)">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="student-name" required>
                </div>
                <div class="form-group">
                    <label>Gmail Address *</label>
                    <input type="email" id="student-email" required>
                </div>
                <div class="form-group">
                    <label>Batch Time *</label>
                    <input type="text" id="student-batch" required>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-play"></i> Start Examination</button>
            </form>
        </div>
    </div>

    <!-- EXAM INTERFACE -->
    <div class="test-wrapper" id="exam-wrapper">
        
        <!-- LEFT: QUESTION DISPLAY AREA -->
        <div class="question-card">
            <div>
                <div class="q-header">
                    <span class="q-title" id="display-q-num"><i class="fa-solid fa-flask-vial"></i> Question 1</span>
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <span style="font-weight: 700; color: #64748b;" id="marking-scheme">Marks: +1 / -0.25</span>
                        <div class="timer-display" id="timer-box"><i class="fa-solid fa-clock"></i> <span id="time-left">00:00</span></div>
                    </div>
                </div>

                <div id="q-content-box">
                    <p class="q-text" id="q-text">Loading question content...</p>

                    <div class="options-list" id="options-container">
                        <!-- Options Rendered Dynamically -->
                    </div>
                </div>
            </div>

            <!-- ACTION CONTROL BUTTONS -->
            <div class="action-buttons">
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn btn-save" onclick="saveAndNext()"><i class="fa-solid fa-check"></i> Save & Next</button>
                    <button class="btn btn-review" onclick="markForReview()"><i class="fa-solid fa-bookmark"></i> Mark for Review</button>
                    <button class="btn btn-clear" onclick="clearResponse()"><i class="fa-solid fa-rotate-left"></i> Clear Answer</button>
                </div>
                <button class="btn btn-submit" onclick="submitExam()"><i class="fa-solid fa-paper-plane"></i> Submit Test</button>
            </div>
        </div>

        <!-- RIGHT: NTA QUESTION PALETTE SIDEBAR -->
        <div class="palette-sidebar">
            <div class="palette-title"><i class="fa-solid fa-border-all"></i> Question Palette</div>

            <!-- PALETTE LEGEND GUIDE -->
            <div class="legend-grid">
                <div class="legend-item"><div class="badge-icon badge-answered"><i class="fa-solid fa-check"></i></div> Answered</div>
                <div class="legend-item"><div class="badge-icon badge-not-answered"><i class="fa-solid fa-xmark"></i></div> Not Answered</div>
                <div class="legend-item"><div class="badge-icon badge-review"><i class="fa-solid fa-bookmark"></i></div> Review</div>
                <div class="legend-item"><div class="badge-icon badge-not-visited"></div> Not Visited</div>
            </div>

            <!-- PALETTE GRID BUTTONS -->
            <div class="question-grid" id="palette-grid">
                <!-- Dynamically Generated Buttons -->
            </div>
        </div>

    </div>

    <!-- EXAM ENGINE & PALETTE LOGIC -->
    <script>
        let questions = [];
        let currentIndex = 0;
        let questionStates = [];
        let isExamActive = false;
        let tabSwitchCount = 0;

        let examDurationMinutes = 15; // Controlled by admin/default
        let timerInterval = null;
        let totalSecondsLeft = 0;

        let studentData = {
            name: '',
            email: '',
            batch: ''
        };

        function startExamPortal(e) {
            e.preventDefault();
            const emailInput = document.getElementById('student-email').value.trim().toLowerCase();

            // GMAIL ATTEMPT CHECK
            let attemptedEmails = JSON.parse(localStorage.getItem('attemptedEmails') || '[]');
            
            if (attemptedEmails.includes(emailInput)) {
                alert("You have already attempted this test");
                return;
            }

            studentData.name = document.getElementById('student-name').value.trim();
            studentData.email = emailInput;
            studentData.batch = document.getElementById('student-batch').value.trim();

            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('exam-wrapper').style.display = 'grid';

            isExamActive = true;
            fetchQuestions();
        }

        async function fetchQuestions() {
            const urlParams = new URLSearchParams(window.location.search);
            const chapterFile = urlParams.get('quiz') || 'chapter1.json';

            try {
                const response = await fetch(chapterFile);
                const data = await response.json();
                
                // Admin dynamic structure sync (Array or Object format)
                if (Array.isArray(data)) {
                    questions = data;
                } else if (data.questions) {
                    questions = data.questions;
                    if (data.duration) examDurationMinutes = data.duration;
                }
            } catch (err) {
                // Fallback default sample questions
                questions = [
                    { question: "Vector A and Vector B are perpendicular. Their dot product will be?", options: ["0", "1", "-1", "Infinity"], answer: 0 },
                    { question: "SI unit of acceleration is?", options: ["m/s", "m/s²", "kg m/s", "N/m"], answer: 1 },
                    { question: "What is the dimensional formula of Force?", options: ["M L T⁻¹", "M L T⁻²", "M L² T⁻²", "M L⁻¹ T⁻²"], answer: 1 }
                ];
            }

            questionStates = questions.map(() => ({
                status: 'not-visited',
                selectedOption: null
            }));

            renderPalette();
            loadQuestion(0);
            startTimer(examDurationMinutes);
        }

        function startTimer(minutes) {
            totalSecondsLeft = minutes * 60;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                if (totalSecondsLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Time's up! Your exam is being automatically submitted.");
                    submitExam(true);
                } else {
                    totalSecondsLeft--;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let mins = Math.floor(totalSecondsLeft / 60);
            let secs = totalSecondsLeft % 60;
            document.getElementById('time-left').innerText = 
                `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function loadQuestion(index) {
            if (!questions || questions.length === 0) return;
            currentIndex = index;

            if (questionStates[index].status === 'not-visited') {
                questionStates[index].status = 'not-answered';
            }

            document.getElementById('display-q-num').innerHTML = `<i class="fa-solid fa-flask-vial"></i> Question ${index + 1} of ${questions.length}`;
            
            const qObj = questions[index];
            document.getElementById('q-text').innerText = qObj.question || qObj.text || "No Question Text Found";

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';

            const optsList = qObj.options || [];
            optsList.forEach((optText, optIdx) => {
                const isSelected = questionStates[index].selectedOption === optIdx;
                const div = document.createElement('div');
                div.className = `option-item ${isSelected ? 'selected' : ''}`;
                div.onclick = () => selectOption(optIdx);
                div.innerHTML = `
                    <input type="radio" name="option" ${isSelected ? 'checked' : ''}>
                    <span>${String.fromCharCode(65 + optIdx)}. ${optText}</span>
                `;
                optsContainer.appendChild(div);
            });

            renderPalette();
        }

        function selectOption(optIdx) {
            questionStates[currentIndex].selectedOption = optIdx;
            loadQuestion(currentIndex);
        }

        function saveAndNext() {
            if (questionStates[currentIndex].selectedOption !== null) {
                questionStates[currentIndex].status = 'answered';
            } else {
                questionStates[currentIndex].status = 'not-answered';
            }

            if (currentIndex < questions.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                renderPalette();
            }
        }

        function markForReview() {
            if (questionStates[currentIndex].selectedOption !== null) {
                questionStates[currentIndex].status = 'review-answered';
            } else {
                questionStates[currentIndex].status = 'review';
            }

            if (currentIndex < questions.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                renderPalette();
            }
        }

        function clearResponse() {
            questionStates[currentIndex].selectedOption = null;
            questionStates[currentIndex].status = 'not-answered';
            loadQuestion(currentIndex);
        }

        function renderPalette() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';

            questionStates.forEach((st, idx) => {
                const btn = document.createElement('button');
                btn.className = `q-btn status-${st.status} ${idx === currentIndex ? 'active-current' : ''}`;
                btn.innerText = idx + 1;
                btn.onclick = () => loadQuestion(idx);
                grid.appendChild(btn);
            });
        }

        function submitExam(forceSubmit = false) {
            if (!isExamActive) return;
            let answered = questionStates.filter(s => s.status === 'answered' || s.status === 'review-answered').length;
            
            if (forceSubmit || confirm(`Candidate: ${studentData.name}\nBatch: ${studentData.batch}\n\nAre you sure you want to submit?\nAttempted: ${answered} / ${questions.length}`)) {
                isExamActive = false;
                clearInterval(timerInterval);

                // SAVE EMAIL TO PREVENT RE-ATTEMPT
                let attemptedEmails = JSON.parse(localStorage.getItem('attemptedEmails') || '[]');
                attemptedEmails.push(studentData.email);
                localStorage.setItem('attemptedEmails', JSON.stringify(attemptedEmails));

                alert("Exam submitted successfully!");
            }
        }
    </script>

    <!-- FIXED SECURITY & PROCTORING ENGINE -->
    <script>
        // Disable Right-Click
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Disable Copy & Paste
        document.addEventListener('copy', (e) => {
            if (isExamActive) {
                e.preventDefault();
                alert("Security Alert: Copying test contents is prohibited!");
            }
        });

        document.addEventListener('paste', (e) => {
            if (isExamActive) {
                e.preventDefault();
                alert("Security Alert: Pasting functions are locked!");
            }
        });

        // Tab Switch & App Background Monitoring
        document.addEventListener("visibilitychange", function() {
            if (document.hidden && isExamActive) {
                tabSwitchCount++;
                if (tabSwitchCount === 1) {
                    alert("SECURITY WARNING (1/2):\nTab switch or background app detected! Next attempt will result in auto-submission.");
                } else if (tabSwitchCount >= 2) {
                    alert("CRITICAL SECURITY VIOLATION:\nMultiple tab switches detected! Your exam is being automatically submitted now.");
                    submitExam(true);
                }
            }
        });

        // Keyboard Shortcuts Lock
        document.addEventListener("keydown", function(e) {
            if (!isExamActive) return;

            // Ctrl+P / Inspect Element Block
            if (e.ctrlKey && (e.key === 'p' || e.keyCode === 80)) {
                e.preventDefault();
            }
            if (e.key === "F12" || e.keyCode === 123) {
                e.preventDefault();
            }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.keyCode === 73)) {
                e.preventDefault();
            }
            if (e.key === "PrintScreen") {
                navigator.clipboard.writeText("");
                alert("Screenshots are restricted on this exam page!");
            }
        });
    </script>
</body>
</html>
