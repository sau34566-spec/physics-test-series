<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Elite | Student Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Exam Elite</h1>

    <p class="subtitle">
        Student Assessment Portal
    </p>

    <form id="student-login-form">

        <label for="student-name">Student Name</label>
        <input
            type="text"
            id="student-name"
            placeholder="Enter your full name"
            required
        >

        <label for="student-roll">Roll Number</label>
        <input
            type="text"
            id="student-roll"
            placeholder="Enter your roll number"
            required
        >

        <label for="student-email">Registered Gmail</label>
        <input
            type="email"
            id="student-email"
            placeholder="student@gmail.com"
            required
        >

        <button type="submit">
            Continue to Test
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

const form = document.getElementById("student-login-form");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("student-name").value.trim();
    const roll = document.getElementById("student-roll").value.trim();
    const email = document.getElementById("student-email").value.trim().toLowerCase();

    if (!name || !roll || !email) {
        showMessage("Please fill all details.", "error");
        return;
    }

    if (!email.endsWith("@gmail.com")) {
        showMessage("Please enter a valid Gmail address.", "error");
        return;
    }

    const studentInfo = {
        name: name,
        roll: roll,
        email: email
    };

    sessionStorage.setItem(
        "student_info",
        JSON.stringify(studentInfo)
    );

    showMessage("Verification successful. Opening test...", "success");

    setTimeout(function() {
        window.location.href = "nta.html";
    }, 800);

});

function showMessage(text, type) {

    message.innerText = text;
    message.className = type;
    message.style.display = "block";

}

</script>

</body>
</html>
