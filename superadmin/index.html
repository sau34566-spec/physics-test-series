<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookesh | Platform Administration</title><link rel="stylesheet" href="../css/superadmin.css"></head>
<body><div id="notice" role="status" aria-live="polite"></div>
<section id="loginScreen" class="login"><form id="loginForm" class="panel">
<div class="eyebrow">BOOKESH · PLATFORM</div><h1>Super Admin</h1><p>Manage institutes and their portal configuration.</p>
<label>Email<input id="email" type="email" autocomplete="username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Sign in</button><button type="button" class="secondary" id="resetPassword">Reset password</button>
<p id="loginError" role="alert"></p></form></section>
<div id="appShell" hidden><aside id="sidebar"><div class="eyebrow">BOOKESH</div><h2>Platform</h2><nav id="nav"></nav><button class="secondary" id="logout">Sign out</button></aside>
<main><header><button id="menu" class="secondary" aria-label="Toggle navigation">☰</button><div><div class="eyebrow">PLATFORM ADMINISTRATION</div><h1 id="pageTitle">Dashboard</h1></div><button id="createTop">Create New Institute</button></header>
<section id="content" aria-live="polite"></section></main></div>
<dialog id="preview"><button id="closePreview" class="secondary">Close preview</button><div class="eyebrow">PREVIEW MODE · NO PRODUCTION WRITES</div><div id="previewContent"></div></dialog>
<script src="../js/platform-schema.js"></script><script type="module" src="../js/superadmin.js"></script></body></html>
