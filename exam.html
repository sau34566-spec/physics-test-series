<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Portal - EXAM ELITE</title>
    <link rel="stylesheet" href="../css/exam.css">
</head>
<body>
    <header class="exam-header">
        <div class="branding">EXAM ELITE PORTAL</div>
        <div class="user-meta">Student ID: <span id="studentIdLabel">--</span></div>
        <div class="timer-box">Time Left: <span id="timerDisplay">00:00:00</span></div>
    </header>

    <div class="exam-container">
        <main class="question-pane">
            <div class="question-header">
                <span id="questionNumDisplay">Question 1</span>
                <span id="marksDisplay" class="badge">Marks: +1, -0</span>
            </div>
            <div id="questionText" class="question-body">Loading...</div>
            <div id="optionsContainer" class="options-group"></div>

            <div class="nav-controls">
                <button id="prevBtn" class="btn">Previous</button>
                <button id="clearBtn" class="btn secondary">Clear Choice</button>
                <button id="saveNextBtn" class="btn primary">Save & Next</button>
                <button id="submitExamBtn" class="btn danger">Submit Exam</button>
            </div>
        </main>

        <aside class="palette-pane">
            <h3>Question Palette</h3>
            <div id="paletteGrid" class="palette-grid"></div>
        </aside>
    </div>

    <script type="module">
        import { enforceRoleGuard } from "../js/auth.js";
        import { functions } from "../js/firebase-config.js";
        import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
        import { ExamSecurityMonitor } from "../js/security-monitor.js";

        enforceRoleGuard("student", "/student/login.html");

        let currentAttemptId = null;
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let securityMonitor = null;

        // Offline storage sync mechanism
        function persistLocalAnswer(qId, val) {
            userAnswers[qId] = val;
            localStorage.setItem(`cache_answers_${currentAttemptId}`, JSON.stringify(userAnswers));
        }

        async function initExam() {
            const urlParams = new URLSearchParams(window.location.search);
            const examId = urlParams.get("examId");
            const sessionId = crypto.randomUUID();

            try {
                const startFn = httpsCallable(functions, "startExamAttempt");
                const res = await startFn({ examId, sessionId });
                currentAttemptId = res.data.attemptId;

                const getQuestionsFn = httpsCallable(functions, "getAttemptQuestions");
                const qRes = await getQuestionsFn({ attemptId: currentAttemptId });
                
                questions = qRes.data.questions;
                
                // Hydrate offline cache recovery if exists
                const cached = localStorage.getItem(`cache_answers_${currentAttemptId}`);
                userAnswers = cached ? JSON.parse(cached) : (qRes.data.answers || {});

                // Start security monitor
                securityMonitor = new ExamSecurityMonitor(currentAttemptId, examId, "STUDENT_UID", "INST_ID", 3, triggerAutoSubmit);
                securityMonitor.start();

                renderQuestion(0);
                renderPalette();
                startServerTimer(qRes.data.attemptEndTime.seconds * 1000);

            } catch (err) {
                alert(`Exam Failed to Load: ${err.message}`);
                window.location.href = "/student/dashboard.html";
            }
        }

        function renderQuestion(idx) {
            currentIndex = idx;
            const q = questions[idx];
            document.getElementById("questionNumDisplay").innerText = `Question ${idx + 1} of ${questions.length}`;
            document.getElementById("questionText").innerText = q.questionText.en || q.questionText;

            const opts = document.getElementById("optionsContainer");
            opts.innerHTML = "";
            q.options.forEach(opt => {
                const label = document.createElement("label");
                label.className = "option-label";
                label.innerHTML = `
                    <input type="radio" name="opt" value="${opt.id}" ${userAnswers[q.id] === opt.id ? 'checked' : ''}>
                    <span>${opt.id}. ${opt.text.en || opt.text}</span>
                `;
                label.querySelector('input').onchange = () => persistLocalAnswer(q.id, opt.id);
                opts.appendChild(label);
            });
            renderPalette();
        }

        function renderPalette() {
            const grid = document.getElementById("paletteGrid");
            grid.innerHTML = "";
            questions.forEach((q, i) => {
                const btn = document.createElement("button");
                btn.className = `palette-btn ${userAnswers[q.id] ? 'answered' : ''} ${i === currentIndex ? 'active' : ''}`;
                btn.innerText = i + 1;
                btn.onclick = () => renderQuestion(i);
                grid.appendChild(btn);
            });
        }

        function startServerTimer(endTimeMs) {
            const timer = setInterval(() => {
                const remaining = Math.max(0, Math.floor((endTimeMs - Date.now()) / 1000));
                const hrs = String(Math.floor(remaining / 3600)).padStart(2, '0');
                const mins = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
                const secs = String(remaining % 60).padStart(2, '0');
                
                document.getElementById("timerDisplay").innerText = `${hrs}:${mins}:${secs}`;

                if (remaining <= 0) {
                    clearInterval(timer);
                    triggerAutoSubmit();
                }
            }, 1000);
        }

        async function triggerAutoSubmit() {
            if (securityMonitor) securityMonitor.stop();
            try {
                const submitFn = httpsCallable(functions, "submitExamAttempt");
                await submitFn({ attemptId: currentAttemptId, answers: userAnswers, isAutoSubmit: true });
                localStorage.removeItem(`cache_answers_${currentAttemptId}`);
                alert("Exam submitted successfully.");
                window.location.href = `/student/result.html?attemptId=${currentAttemptId}`;
            } catch (err) {
                alert(`Submission error: ${err.message}`);
            }
        }

        document.getElementById("saveNextBtn").onclick = () => {
            if (currentIndex < questions.length - 1) renderQuestion(currentIndex + 1);
        };
        document.getElementById("prevBtn").onclick = () => {
            if (currentIndex > 0) renderQuestion(currentIndex - 1);
        };
        document.getElementById("clearBtn").onclick = () => {
            delete userAnswers[questions[currentIndex].id];
            persistLocalAnswer(questions[currentIndex].id, null);
            renderQuestion(currentIndex);
        };
        document.getElementById("submitExamBtn").onclick = () => {
            if (confirm("Are you sure you want to finalize your submission?")) triggerAutoSubmit();
        };

        window.onload = initExam;
    </script>
</body>
</html>
