 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Elite | Test</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .student-info h2 {
            font-size: 17px;
        }

        .student-info p {
            font-size: 12px;
            color: #cbd5e1;
            margin-top: 4px;
        }

        .timer {
            background: #fee2e2;
            color: #991b1b;
            padding: 9px 13px;
            border-radius: 8px;
            font-weight: bold;
            white-space: nowrap;
        }

        .container {
            max-width: 850px;
            margin: auto;
            padding: 20px;
        }

        .progress-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #475569;
        }

        .progress-bg {
            height: 7px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width .3s;
        }

        .question-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .question-number {
            font-size: 13px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 12px;
        }

        .question {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .option {
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 9px;
            padding: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: .2s;
        }

        .option:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .option.selected {
            border-color: #2563eb;
            background: #dbeafe;
        }

        .option input {
            width: 17px;
            height: 17px;
            accent-color: #2563eb;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .prev {
            background: #e2e8f0;
            color: #334155;
        }

        .next {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .submit {
            background: #10b981;
            color: white;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .warning {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        @media(max-width:600px) {
            header {
                padding: 12px;
            }

            .student-info h2 {
                font-size: 14px;
            }

            .timer {
                font-size: 13px;
                padding: 8px;
            }

            .container {
                padding: 12px;
            }

            .question-card {
                padding: 17px;
            }

            .question {
                font-size: 16px;
            }

            .buttons button {
                padding: 10px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div id="warning" class="warning"></div>

<header>
    <div class="student-info">
        <h2 id="student-name">Student</h2>
        <p id="student-roll">Roll: -</p>
    </div>

    <div class="timer">
        ⏱ <span id="timer">00:00</span>
    </div>
</header>

<div class="container">
    <div class="progress-card">
        <div class="progress-text">
            <span id="question-count">Question 1 of 10</span>
            <span id="answered-count">Answered: 0</span>
        </div>

        <div class="progress-bg">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <div id="quiz-area">
        <div class="loading">
            Loading test...
        </div>
    </div>
</div>

<script type="module">

"use strict";

/* =========================================================
   STUDENT INFORMATION
========================================================= */

const studentInfo = JSON.parse(sessionStorage.getItem("student_info") || "null");

if (!studentInfo) {
    alert("Student verification required.");
    window.location.href = "index.html";
}

/* =========================================================
   TEST CONFIGURATION
========================================================= */

const examConfig = JSON.parse(sessionStorage.getItem("active_exam_config") || "null");

const defaultQuestions = [
    {
        question: "How do plants make their own food?",
        options: {
            A: "Respiration",
            B: "Photosynthesis",
            C: "Digestion",
            D: "Transpiration"
        },
        answer: "B"
    },
    {
        question: "What is the chemical formula of water?",
        options: {
            A: "CO2",
            B: "H2O",
            C: "O2",
            D: "H2SO4"
        },
        answer: "B"
    },
    {
        question: "Which is the largest organ in the human body?",
        options: {
            A: "Heart",
            B: "Liver",
            C: "Skin",
            D: "Lungs"
        },
        answer: "C"
    },
    {
        question: "What do we get from the Sun?",
        options: {
            A: "Light and Energy",
            B: "Only Water",
            C: "Only Air",
            D: "Only Sound"
        },
        answer: "A"
    },
    {
        question: "Which substance gives blood its red colour?",
        options: {
            A: "Platelets",
            B: "Hemoglobin",
            C: "Plasma",
            D: "White Blood Cells"
        },
        answer: "B"
    },
    {
        question: "In which medium can sound NOT travel?",
        options: {
            A: "Solid",
            B: "Liquid",
            C: "Gas",
            D: "Vacuum"
        },
        answer: "D"
    },
    {
        question: "What is Earth's natural satellite?",
        options: {
            A: "Mars",
            B: "Sun",
            C: "Moon",
            D: "Venus"
        },
        answer: "C"
    },
    {
        question: "Which fruit is a rich source of Vitamin C?",
        options: {
            A: "Orange",
            B: "Rice",
            C: "Butter",
            D: "Lentils"
        },
        answer: "A"
    },
    {
        question: "Approximately what percentage of Earth's atmosphere is oxygen?",
        options: {
            A: "21%",
            B: "50%",
            C: "78%",
            D: "10%"
        },
        answer: "A"
    },
    {
        question: "Which metal is a good conductor of electricity?",
        options: {
            A: "Wood",
            B: "Plastic",
            C: "Copper",
            D: "Rubber"
        },
        answer: "C"
    }
];

let questions = [];

/* =========================================================
   LOAD QUESTIONS
========================================================= */

function normalizeQuestion(item) {
    const options = item.options || {};
    return {
        question: item.question || item.q || "Question unavailable",
        options: {
            A: typeof options === "object" && !Array.isArray(options) ? options.A : options[0],
            B: typeof options === "object" && !Array.isArray(options) ? options.B : options[1],
            C: typeof options === "object" && !Array.isArray(options) ? options.C : options[2],
            D: typeof options === "object" && !Array.isArray(options) ? options.D : options[3]
        },
        answer: item.answer || item.a || "A"
    };
}

if (
    examConfig &&
    Array.isArray(examConfig.questions) &&
    examConfig.questions.length > 0
) {
    questions = examConfig.questions.map(normalizeQuestion);
} else {
    questions = defaultQuestions.map(normalizeQuestion);
}

/* =========================================================
   RANDOM QUESTION LIMIT
========================================================= */

const questionLimit = Number(
    examConfig?.studentDisplayLimit ||
    examConfig?.questionLimit ||
    questions.length
);

if (questionLimit > 0 && questionLimit < questions.length) {
    questions = [...questions]
        .sort(() => Math.random() - 0.5)
        .slice(0, questionLimit);
}

/* =========================================================
   EXAM VARIABLES
========================================================= */

let currentQuestion = 0;
let answers = {};
let submitted = false;
window.isTestSubmitted = false;

let durationMinutes = Number(
    examConfig?.examDurationMinutes ||
    examConfig?.durationMinutes ||
    10
);

let totalSeconds = durationMinutes * 60;
let timerInterval;
const examTimerKey = "active_exam_end_time";

/* =========================================================
   STUDENT DISPLAY
========================================================= */

if (studentInfo) {
    document.getElementById("student-name").innerText = studentInfo.name || "Student";
    document.getElementById("student-roll").innerText = "Roll: " + (studentInfo.roll || "-");
}

/* =========================================================
   STEP 9: STABLE ANSWER SAVE
========================================================= */

window.saveAnswer = function(option) {
    if (window.isTestSubmitted || submitted) {
        return;
    }
    answers[currentQuestion] = String(option);
};

/* =========================================================
   STEP 9: STABLE QUESTION RENDER (DOM-BASED)
========================================================= */

function renderQuestion() {
    const quizArea = document.getElementById("quiz-area");

    if (!questions.length) {
        quizArea.innerHTML = `
            <div class="loading">
                No questions available.
            </div>
        `;
        return;
    }

    const q = questions[currentQuestion];

    quizArea.innerHTML = "";

    const card = document.createElement("div");
    card.className = "question-card";

    const qNumber = document.createElement("div");
    qNumber.className = "question-number";
    qNumber.innerText = `QUESTION ${currentQuestion + 1}`;

    const qText = document.createElement("div");
    qText.className = "question";
    qText.innerText = q.question;

    const optionContainer = document.createElement("div");
    optionContainer.className = "options";

    ["A", "B", "C", "D"].forEach(optionKey => {
        const optionVal = q.options[optionKey];
        if (optionVal === undefined || optionVal === null) return;

        const label = document.createElement("label");
        const isSelected = answers[currentQuestion] === optionKey;
        label.className = `option ${isSelected ? "selected" : ""}`;

        const input = document.createElement("input");
        input.type = "radio";
        input.name = "question-option";
        input.value = String(optionKey);

        if (
            answers[currentQuestion] !== undefined &&
            answers[currentQuestion] === String(optionKey)
        ) {
            input.checked = true;
        }

        input.addEventListener("change", () => {
            window.saveAnswer(optionKey);
            renderQuestion();
        });

        label.addEventListener("click", () => {
            if (!input.checked) {
                input.checked = true;
                window.saveAnswer(optionKey);
                renderQuestion();
            }
        });

        const span = document.createElement("span");
        const b = document.createElement("b");
        b.innerText = `${optionKey}. `;
        span.appendChild(b);
        span.appendChild(document.createTextNode(String(optionVal)));

        label.appendChild(input);
        label.appendChild(span);
        optionContainer.appendChild(label);
    });

    const buttonsDiv = document.createElement("div");
    buttonsDiv.className = "buttons";

    const previousButton = document.createElement("button");
    previousButton.id = "prev-btn";
    previousButton.className = "prev";
    previousButton.innerText = "← Previous";
    previousButton.disabled = currentQuestion === 0;
    previousButton.onclick = window.prevQuestion || previousQuestion;

    const nextButton = document.createElement("button");
    nextButton.id = "next-btn";
    nextButton.className = "next";
    nextButton.innerText = "Save & Next →";
    nextButton.onclick = window.nextQuestion || nextQuestion;

    const submitButton = document.createElement("button");
    submitButton.id = "submit-btn";
    submitButton.className = "submit";
    submitButton.innerText = "Submit Test ✓";
    submitButton.onclick = confirmSubmit;

    buttonsDiv.appendChild(previousButton);

    const isLastQuestion = currentQuestion === questions.length - 1;
    if (isLastQuestion) {
        nextButton.style.display = "none";
        submitButton.style.display = "inline-flex";
        buttonsDiv.appendChild(submitButton);
    } else {
        nextButton.style.display = "inline-flex";
        submitButton.style.display = "none";
        buttonsDiv.appendChild(nextButton);
    }

    card.appendChild(qNumber);
    card.appendChild(qText);
    card.appendChild(optionContainer);
    card.appendChild(buttonsDiv);

    quizArea.appendChild(card);

    updateProgress();
}

/* =========================================================
   NEXT / PREVIOUS QUESTION
========================================================= */

function nextQuestion() {
    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
    }
}

function previousQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
    }
}

window.nextQuestion = nextQuestion;
window.prevQuestion = previousQuestion;
window.previousQuestion = previousQuestion;

/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {
    const total = questions.length;
    const answered = Object.keys(answers).length;

    document.getElementById("question-count").innerText =
        `Question ${currentQuestion + 1} of ${total}`;

    document.getElementById("answered-count").innerText =
        `Answered: ${answered}`;

    const percentage = total > 0 ? (answered / total) * 100 : 0;
    document.getElementById("progress-fill").style.width = percentage + "%";
}

/* =========================================================
   RELIABLE TIMER
========================================================= */

function startExamTimer() {
    let endTime = Number(sessionStorage.getItem(examTimerKey));
    const now = Date.now();

    if (!endTime || endTime <= now) {
        endTime = now + (durationMinutes * 60 * 1000);
        sessionStorage.setItem(examTimerKey, String(endTime));
    }

    function updateTimer() {
        if (window.isTestSubmitted || submitted) {
            clearInterval(timerInterval);
            return;
        }

        const remaining = Math.max(0, endTime - Date.now());
        totalSeconds = Math.ceil(remaining / 1000);

        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        const timerElement = document.getElementById("timer");
        if (timerElement) {
            timerElement.innerText =
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0");
        }

        if (remaining <= 0) {
            clearInterval(timerInterval);
            sessionStorage.removeItem(examTimerKey);

            if (!window.isTestSubmitted && !submitted) {
                if (typeof window.submitExam === "function") {
                    window.submitExam("Time expired");
                }
            }
        }
    }

    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
}

/* =========================================================
   SUBMIT CONFIRMATION
========================================================= */

window.confirmSubmit = function() {
    const unanswered = questions.length - Object.keys(answers).length;

    const message = unanswered > 0
        ? `You have ${unanswered} unanswered question(s).\n\nAre you sure you want to submit?`
        : "Are you sure you want to submit the test?";

    if (confirm(message)) {
        window.submitExam("Manual submission");
    }
};

/* =========================================================
   STEP 11 — FINAL SUBMIT SYSTEM
========================================================= */

window.submitExam = async function (reason = "Manual submission") {

    if (window.isTestSubmitted || submitted) return;

    window.isTestSubmitted = true;
    submitted = true;

    if (typeof timerInterval !== "undefined" && timerInterval) {
        clearInterval(timerInterval);
    }

    if (typeof examTimerKey !== "undefined") {
        sessionStorage.removeItem(examTimerKey);
    }

    let correctCount = 0;
    let incorrectCount = 0;
    let unansweredCount = 0;

    questions.forEach((question, index) => {
        const selectedAnswer = answers[index];

        if (!selectedAnswer) {
            unansweredCount++;
        } else if (
            String(selectedAnswer).trim().toUpperCase() ===
            String(question.answer).trim().toUpperCase()
        ) {
            correctCount++;
        } else {
            incorrectCount++;
        }
    });

    const positiveMarks = correctCount;
    const negativeMarks = incorrectCount * 0.25;
    const finalScore = positiveMarks - negativeMarks;

    const securityData = getSecurityResultData();

    const submissionData = {
        name: studentInfo?.name || "Student",
        roll: studentInfo?.roll || "-",
        email: studentInfo?.email || "-",
        correct: correctCount,
        incorrect: incorrectCount,
        unanswered: unansweredCount,
        positiveMarks: positiveMarks,
        negativeMarks: negativeMarks,
        score: Number(finalScore.toFixed(2)),
        totalQuestions: questions.length,
        submissionReason: reason,

        tabSwitches: securityData.tabSwitches,
        copyAttempts: securityData.copyAttempts,
        pasteAttempts: securityData.pasteAttempts,
        cutAttempts: securityData.cutAttempts,
        contextMenuAttempts: securityData.contextMenuAttempts,
        penaltiesApplied: securityData.penaltiesApplied,
        submittedAt: new Date().toISOString()
    };

    const oldSubmissions = JSON.parse(localStorage.getItem("exam_submissions") || "[]");
    oldSubmissions.push(submissionData);
    localStorage.setItem("exam_submissions", JSON.stringify(oldSubmissions));

    sessionStorage.setItem("last_exam_result", JSON.stringify(submissionData));

    window.location.href = "result.html";
};

/* =========================================================
   START EXAM & TIMER
========================================================= */

renderQuestion();
startExamTimer();

/* =========================================================
   ANTI-CHEATING SECURITY
========================================================= */

let securityTabSwitches = 0;
let securitySubmitted = false;
let copyAttempts = 0;
let pasteAttempts = 0;
let cutAttempts = 0;
let contextMenuAttempts = 0;
let penaltiesApplied = 0;

function showSecurityWarning(message) {
    const warningEl = document.getElementById("warning");
    if (warningEl) {
        warningEl.style.display = "block";
        warningEl.innerText = message;
    }
}

function handleExamViolation() {
    if (securitySubmitted || submitted || window.isTestSubmitted) return;

    securityTabSwitches++;

    if (securityTabSwitches === 1) {
        showSecurityWarning("WARNING 1/2: Tab switching / leaving test window detected! Next attempt will automatically submit your exam.");
        alert("WARNING 1/2: Tab switching detected! Returning to another tab or losing focus will automatically submit your exam.");
    } else if (securityTabSwitches >= 2) {
        securitySubmitted = true;
        showSecurityWarning("⚠️ Multiple violations detected! Your exam is being submitted.");
        alert("CRITICAL VIOLATION: Tab switch limit exceeded! Your exam is being automatically submitted.");
        
        setTimeout(() => {
            if (typeof window.submitExam === "function") {
                window.submitExam("Anti-cheating violation: Tab switch limit exceeded");
            }
        }, 1200);
    }
}

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
        handleExamViolation();
    }
});

window.addEventListener("blur", () => {
    setTimeout(() => {
        if (!document.hidden) {
            handleExamViolation();
        }
    }, 100);
});

window.addEventListener("beforeunload", () => {
    if (!securitySubmitted && !submitted) {
        sessionStorage.setItem("exam_security_tab_switches", String(securityTabSwitches));
    }
});

const savedSecurityCount = parseInt(sessionStorage.getItem("exam_security_tab_switches") || "0", 10);
if (!isNaN(savedSecurityCount)) {
    securityTabSwitches = savedSecurityCount;
}

document.addEventListener("contextmenu", function (event) {
    if (securitySubmitted || submitted || window.isTestSubmitted) return;
    event.preventDefault();
    contextMenuAttempts++;
    showSecurityWarning("⚠️ Right-click is disabled during the examination.");
});

document.addEventListener("copy", function (event) {
    if (securitySubmitted || submitted || window.isTestSubmitted) return;
    event.preventDefault();
    copyAttempts++;
    showSecurityWarning("⚠️ Copying content is not allowed during the examination.");
});

document.addEventListener("paste", function (event) {
    if (securitySubmitted || submitted || window.isTestSubmitted) return;
    event.preventDefault();
    pasteAttempts++;
    showSecurityWarning("⚠️ Pasting content is not allowed during the examination.");
});

document.addEventListener("cut", function (event) {
    if (securitySubmitted || submitted || window.isTestSubmitted) return;
    event.preventDefault();
    cutAttempts++;
    showSecurityWarning("⚠️ Cutting content is not allowed during the examination.");
});

function getSecurityResultData() {
    return {
        tabSwitches: Number(typeof securityTabSwitches !== "undefined" ? securityTabSwitches : 0),
        copyAttempts: Number(typeof copyAttempts !== "undefined" ? copyAttempts : 0),
        pasteAttempts: Number(typeof pasteAttempts !== "undefined" ? pasteAttempts : 0),
        cutAttempts: Number(typeof cutAttempts !== "undefined" ? cutAttempts : 0),
        contextMenuAttempts: Number(typeof contextMenuAttempts !== "undefined" ? contextMenuAttempts : 0),
        penaltiesApplied: Number(typeof penaltiesApplied !== "undefined" ? penaltiesApplied : 0)
    };
}

/* =========================================================
   STEP 12 — FINAL INTEGRATION + AUTO SAVE & STATE RECOVERY
========================================================= */

function saveExamState() {
    if (window.isTestSubmitted || submitted) return;
    const state = {
        currentIndex: currentQuestion,
        answers: answers
    };
    sessionStorage.setItem("active_exam_state", JSON.stringify(state));
}

function restoreExamState() {
    try {
        const savedState = sessionStorage.getItem("active_exam_state");
        if (!savedState) return;

        const state = JSON.parse(savedState);
        if (state.answers && typeof state.answers === "object") {
            answers = state.answers;
        }

        if (
            Number.isInteger(state.currentIndex) &&
            state.currentIndex >= 0 &&
            state.currentIndex < questions.length
        ) {
            currentQuestion = state.currentIndex;
        }
    } catch (error) {
        console.warn("Exam state recovery failed:", error);
    }
}

// Save whenever answer changes
const originalSaveAnswer = window.saveAnswer;
window.saveAnswer = function (option) {
    if (typeof originalSaveAnswer === "function") {
        originalSaveAnswer(option);
    } else {
        answers[currentQuestion] = String(option);
    }
    saveExamState();
};

// Save whenever question changes
const originalNextQuestion = window.nextQuestion;
window.nextQuestion = function () {
    if (typeof originalNextQuestion === "function") {
        originalNextQuestion();
    }
    saveExamState();
};

const originalPrevQuestion = window.prevQuestion;
window.prevQuestion = function () {
    if (typeof originalPrevQuestion === "function") {
        originalPrevQuestion();
    }
    saveExamState();
};

// Restore state before displaying question
restoreExamState();

// Re-render after restoring state
if (typeof renderQuestion === "function") {
    renderQuestion();
}

// Periodic backup
setInterval(() => {
    if (!window.isTestSubmitted) {
        saveExamState();
    }
}, 3000);

</script>

</body>
</html>
