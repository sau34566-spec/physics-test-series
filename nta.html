 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Examination Portal</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="security.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; user-select: none; }
    body { background-color: #f4f6f9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { background: #003366; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
    .timer-box { background: #ff9800; color: #fff; padding: 6px 14px; border-radius: 4px; font-weight: bold; font-size: 16px; }

    .exam-container { display: flex; flex: 1; overflow: hidden; }
    
    .question-section { flex: 3; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; background: white; border-right: 2px solid #e0e0e0; overflow-y: auto; }
    .q-header { font-size: 16px; font-weight: bold; border-bottom: 2px solid #003366; padding-bottom: 8px; margin-bottom: 15px; }
    .q-text { font-size: 16px; color: #333; margin-bottom: 20px; line-height: 1.5; }
    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .option-item { border: 1px solid #ccc; padding: 12px 15px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
    .option-item:hover { background-color: #f0f4f8; }
    .option-item.selected { background-color: #e3f2fd; border-color: #2196f3; font-weight: bold; }
    .option-item input { accent-color: #003366; width: 18px; height: 18px; }

    .palette-section { flex: 1; background: #fafafa; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; min-width: 280px; }
    .student-info { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
    
    .status-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; margin-bottom: 15px; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .badge { width: 22px; height: 22px; display: inline-flex; justify-content: center; align-items: center; color: white; font-size: 11px; font-weight: bold; border-radius: 3px; }
    .bg-answered { background: #2e7d32; }
    .bg-not-answered { background: #c62828; }
    .bg-not-visited { background: #e0e0e0; color: #333; border: 1px solid #ccc; }
    .bg-review { background: #6a1b9a; }

    .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
    .btn-palette { width: 100%; height: 38px; border: 1px solid #ccc; background: white; font-weight: bold; border-radius: 4px; cursor: pointer; color: #333; font-size: 13px; }
    .btn-palette.active { border: 2px solid #000; box-shadow: 0 0 4px rgba(0,0,0,0.3); }
    .btn-palette.bg-answered { background: #2e7d32; color: white; border-color: #2e7d32; }
    .btn-palette.bg-not-answered { background: #c62828; color: white; border-color: #c62828; }
    .btn-palette.bg-review { background: #6a1b9a; color: white; border-color: #6a1b9a; }

    .action-bar { border-top: 1px solid #ddd; padding: 12px 20px; background: #eee; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .btn { padding: 10px 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
    .btn-save { background: #2e7d32; color: white; }
    .btn-mark { background: #6a1b9a; color: white; }
    .btn-clear { background: #d32f2f; color: white; }
    .btn-submit { background: #003366; color: white; width: 100%; margin-top: 10px; }

    /* Performance Dashboard Modal/Overlay Styling */
    #dashboard-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
    .dashboard-card { background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 600px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
    .dashboard-card h2 { color: #003366; margin-bottom: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; text-align: left; }
    .stat-box { background: #f4f6f9; padding: 15px; border-radius: 6px; border-left: 4px solid #003366; }
    .stat-box h4 { font-size: 13px; color: #666; margin-bottom: 5px; }
    .stat-box p { font-size: 18px; font-weight: bold; color: #333; }
  </style>
</head>
<body>

  <header>
    <h1>Online Examination Portal</h1>
    <div class="timer-box">Time Left: <span id="time-display">00:00:00</span></div>
  </header>

  <div class="exam-container">
    <div class="question-section">
      <div>
        <div class="q-header" id="question-number-title">Question No. 1</div>
        <div class="q-text" id="question-text">Loading question content...</div>
        
        <div class="options-list" id="options-container"></div>
      </div>

      <div class="action-bar">
        <div>
          <button class="btn btn-save" onclick="saveAndNext()">Save & Next</button>
          <button class="btn btn-mark" onclick="markForReview()">Mark for Review & Next</button>
          <button class="btn btn-clear" onclick="clearResponse()">Clear Response</button>
        </div>
      </div>
    </div>

    <div class="palette-section">
      <div>
        <div class="student-info">
          <i class="fa-solid fa-user-circle fa-3x" style="color: #003366;"></i>
          <div>
            <strong id="student-name">Candidate Name</strong><br>
            <small id="student-roll">Roll No: N/A</small>
          </div>
        </div>

        <div class="status-legend">
          <div class="legend-item"><span class="badge bg-answered" id="cnt-answered">0</span> Answered</div>
          <div class="legend-item"><span class="badge bg-not-answered" id="cnt-not-answered">0</span> Not Answered</div>
          <div class="legend-item"><span class="badge bg-not-visited" id="cnt-not-visited">0</span> Not Visited</div>
          <div class="legend-item"><span class="badge bg-review" id="cnt-review">0</span> Marked for Review</div>
        </div>

        <h4 style="margin-bottom: 10px; font-size: 14px;">Choose a Question:</h4>
        <div class="grid-container" id="question-palette-grid"></div>
      </div>

      <button class="btn btn-submit" onclick="confirmSubmitExam()">Submit Test</button>
    </div>
  </div>

  <!-- Performance Dashboard Overlay -->
  <div id="dashboard-overlay">
    <div class="dashboard-card">
      <h2>Exam Performance Dashboard</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <h4>Candidate Name</h4>
          <p id="dash-name">-</p>
        </div>
        <div class="stat-box">
          <h4>Total Score</h4>
          <p id="dash-score">-</p>
        </div>
        <div class="stat-box">
          <h4>Correct Answers</h4>
          <p id="dash-correct">-</p>
        </div>
        <div class="stat-box">
          <h4>Accuracy</h4>
          <p id="dash-accuracy">-</p>
        </div>
      </div>
      <button class="btn btn-submit" style="width: auto; padding: 10px 25px;" onclick="window.location.href='index.html'">Back to Home</button>
    </div>
  </div>

  <script>
    const studentInfo = JSON.parse(sessionStorage.getItem("student_info")) || { name: "Student", roll: "EXAM-1001" };
    document.getElementById("student-name").innerText = studentInfo.name;
    document.getElementById("student-roll").innerText = "Roll: " + studentInfo.roll;

    // Retrieve Admin settings stored via admin panel or use defaults
    const adminConfig = JSON.parse(localStorage.getItem("admin_test_config")) || {
      displayLimit: 6,
      durationMinutes: 5
    };

    let questionsPool = [];
    let currentIdx = 0;
    let studentAnswers = {};
    let questionStatus = {};
    let timeLeftSeconds = (adminConfig.durationMinutes || 5) * 60;

    async function loadQuestions() {
      try {
        const response = await fetch('chapter1.json');
        if (!response.ok) throw new Error("Failed to fetch chapter1.json");
        const data = await response.json();
        
        let allPool = Array.isArray(data) ? data : (data.questions || []);
        
        // Apply Admin Student Display Limit (Randomized or sliced as per pool limit)
        const limit = parseInt(adminConfig.displayLimit) || allPool.length;
        questionsPool = allPool.slice(0, limit);

        if (questionsPool.length === 0) throw new Error("Empty questions");
      } catch (err) {
        console.warn("Fetch error, using default fallback:", err);
        questionsPool = [
          {
            q: "How do plants make their own food?",
            options: ["Respiration", "Photosynthesis", "Digestion", "Transpiration"],
            a: "Photosynthesis"
          }
        ];
      }
      initExam();
    }

    function initExam() {
      questionStatus = {};
      questionsPool.forEach((_, idx) => { questionStatus[idx] = 'not-visited'; });
      renderQuestion(0);
      startTimer();
    }

    function renderQuestion(idx) {
      currentIdx = idx;
      if (questionStatus[idx] === 'not-visited') {
        questionStatus[idx] = 'not-answered';
      }

      const qObj = questionsPool[idx];
      document.getElementById("question-number-title").innerText = `Question No. ${idx + 1} of ${questionsPool.length}`;
      document.getElementById("question-text").innerText = qObj.q;

      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = '';

      const userSelectedOpt = studentAnswers[idx] || '';

      qObj.options.forEach((optText) => {
        const isChecked = userSelectedOpt === optText ? 'checked' : '';
        const itemClass = userSelectedOpt === optText ? 'option-item selected' : 'option-item';

        const label = document.createElement('label');
        label.className = itemClass;
        label.innerHTML = `
          <input type="radio" name="exam-option" value="${optText}" ${isChecked} onclick="selectOption('${optText.replace(/'/g, "\\'")}')">
          <span>${optText}</span>
        `;
        optionsContainer.appendChild(label);
      });

      renderPalette();
      updateCounts();
    }

    window.selectOption = function(optText) {
      studentAnswers[currentIdx] = optText;
      questionStatus[currentIdx] = 'answered';
      
      document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
      const activeInput = document.querySelector(`input[value="${optText}"]`);
      if (activeInput) activeInput.closest('.option-item').classList.add('selected');

      renderPalette();
      updateCounts();
    };

    window.saveAndNext = function() {
      if (currentIdx < questionsPool.length - 1) {
        renderQuestion(currentIdx + 1);
      } else {
        alert("You are on the last question.");
      }
    };

    window.markForReview = function() {
      questionStatus[currentIdx] = 'review';
      renderPalette();
      updateCounts();
      if (currentIdx < questionsPool.length - 1) {
        renderQuestion(currentIdx + 1);
      }
    };

    window.clearResponse = function() {
      delete studentAnswers[currentIdx];
      questionStatus[currentIdx] = 'not-answered';
      renderQuestion(currentIdx);
    };

    function renderPalette() {
      const grid = document.getElementById("question-palette-grid");
      grid.innerHTML = '';

      questionsPool.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-palette';
        btn.innerText = idx + 1;

        const status = questionStatus[idx];
        if (status === 'answered') btn.classList.add('bg-answered');
        else if (status === 'review') btn.classList.add('bg-review');
        else if (status === 'not-answered') btn.classList.add('bg-not-answered');
        else btn.classList.add('bg-not-visited');

        if (idx === currentIdx) btn.classList.add('active');

        btn.onclick = () => renderQuestion(idx);
        grid.appendChild(btn);
      });
    }

    function updateCounts() {
      let counts = { answered: 0, 'not-answered': 0, 'not-visited': 0, review: 0 };
      Object.values(questionStatus).forEach(st => {
        if (counts[st] !== undefined) counts[st]++;
      });

      document.getElementById("cnt-answered").innerText = counts.answered;
      document.getElementById("cnt-not-answered").innerText = counts['not-answered'];
      document.getElementById("cnt-not-visited").innerText = counts['not-visited'];
      document.getElementById("cnt-review").innerText = counts.review;
    }

    function startTimer() {
      const timerInterval = setInterval(() => {
        if (timeLeftSeconds <= 0) {
          clearInterval(timerInterval);
          alert("Time is up! Your exam will be submitted automatically.");
          submitExam();
          return;
        }
        timeLeftSeconds--;
        const hrs = String(Math.floor(timeLeftSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((timeLeftSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(timeLeftSeconds % 60).padStart(2, '0');
        document.getElementById("time-display").innerText = `${hrs}:${mins}:${secs}`;
      }, 1000);
    }

    window.confirmSubmitExam = function() {
      if (confirm("Are you sure you want to submit your exam?")) {
        submitExam();
      }
    };

    function submitExam() {
      let score = 0;
      let attempted = 0;
      questionsPool.forEach((qObj, idx) => {
        if (studentAnswers[idx]) {
          attempted++;
          if (studentAnswers[idx] === qObj.a) score++;
        }
      });

      const accuracy = attempted > 0 ? ((score / attempted) * 100).toFixed(1) + '%' : '0%';

      // Populate and show Performance Dashboard
      document.getElementById("dash-name").innerText = studentInfo.name;
      document.getElementById("dash-score").innerText = `${score} / ${questionsPool.length}`;
      document.getElementById("dash-correct").innerText = `${score} Correct`;
      document.getElementById("dash-accuracy").innerText = accuracy;
      document.getElementById("dashboard-overlay").style.display = 'flex';
    }

    loadQuestions();
  </script>
</body>
</html>
